<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2268" viewBox="0 0 2400 2268"><rect x="0" y="0" width="2400" height="2268" fill="#eeece6"/><text x="60" y="90" font-family="Source Code Pro" font-size="15" font-weight="600" fill="#525252" letter-spacing="1">REPORT 2 · FRAME 3 OF 4</text><text x="60" y="166" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" letter-spacing="-1.6">COMPETITOR ANALYSIS</text><text x="60" y="212" font-family="Anek Latin" font-size="19" fill="#525252">Deliverable #1, start to finish: 17 competitors, 50 capture files, 121 findings, and what went wrong on the way.</text><text x="60" y="242" font-family="Anek Latin" font-size="19" fill="#525252">This is the first time the whole system was pointed at a real piece of work.</text><line x1="60" y1="258" x2="2340" y2="258" stroke="#041222" stroke-width="2"/><g transform="translate(60,304)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">How Deliverable #1 was actually run, start to finish</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Seven steps. The last two are the ones most processes leave out.</text><rect x="0" y="128" width="46" height="46" fill="#041222"/><text x="23" y="158" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">1</text><text x="70" y="148" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Plan</text><text x="70" y="170" font-family="Anek Latin" font-size="16" fill="#525252">research-plan written and approved</text><text x="2280" y="158" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">ART-024</text><line x1="23" y1="174" x2="23" y2="202" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="202" width="46" height="46" fill="#041222"/><text x="23" y="232" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">2</text><text x="70" y="222" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Capture</text><text x="70" y="244" font-family="Anek Latin" font-size="16" fill="#525252">17 competitors visited in two browsers, 50 files written</text><text x="2280" y="232" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">ART-025</text><line x1="23" y1="248" x2="23" y2="276" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="276" width="46" height="46" fill="#041222"/><text x="23" y="306" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">3</text><text x="70" y="296" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Index</text><text x="70" y="318" font-family="Anek Latin" font-size="16" fill="#525252">121 findings extracted, each tied to a named file</text><text x="2280" y="306" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">CAPTURE-INDEX</text><line x1="23" y1="322" x2="23" y2="350" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="350" width="46" height="46" fill="#041222"/><text x="23" y="380" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">4</text><text x="70" y="370" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Synthesise</text><text x="70" y="392" font-family="Anek Latin" font-size="16" fill="#525252">findings grouped into insights and recommendations</text><text x="2280" y="380" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">ART-026</text><line x1="23" y1="396" x2="23" y2="424" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="424" width="46" height="46" fill="#041222"/><text x="23" y="454" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">5</text><text x="70" y="444" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Chart</text><text x="70" y="466" font-family="Anek Latin" font-size="16" fill="#525252">11 charts built, then checked on the rendered page</text><text x="2280" y="454" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">verify-charts</text><line x1="23" y1="470" x2="23" y2="498" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="498" width="46" height="46" fill="#041222"/><text x="23" y="528" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">6</text><text x="70" y="518" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Attack</text><text x="70" y="540" font-family="Anek Latin" font-size="16" fill="#525252">two agents tried to break the result; both found real defects</text><text x="2280" y="528" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">2 reports</text><line x1="23" y1="544" x2="23" y2="572" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="572" width="46" height="46" fill="#041222"/><text x="23" y="602" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">7</text><text x="70" y="592" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Fix</text><text x="70" y="614" font-family="Anek Latin" font-size="16" fill="#525252">every defect fixed, then re-planted to prove the fix works</text><text x="2280" y="602" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">C-053–C-056</text></g><g transform="translate(60,1016)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">121 findings, and every one carries the confidence its capture file gave it</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Deliverable #1 — hands-on competitor capture, 17 competitors, 50 capture files.</text><text x="544" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Verified — exact quote from a capture file</text><rect x="560" y="135" width="1220" height="18" fill="#041222"/><text x="1794" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">101</text><text x="1894" y="148" font-family="Anek Latin" font-size="14" fill="#525252">83% of all findings</text><line x1="0" y1="171" x2="2280" y2="171" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Verified — but qualified in the source</text><rect x="560" y="179" width="157" height="18" fill="#041222"/><text x="1794" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">13</text><text x="1894" y="192" font-family="Anek Latin" font-size="14" fill="#525252">11%</text><line x1="0" y1="215" x2="2280" y2="215" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">A pointer to another file, not a claim</text><rect x="560" y="223" width="84.6" height="18" fill="#041222"/><text x="1794" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">7</text><text x="1894" y="236" font-family="Anek Latin" font-size="14" fill="#525252">6%</text><line x1="0" y1="259" x2="2280" y2="259" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="296" font-family="Anek Latin" font-size="16" fill="#041222">Confidence is copied from the capture file exactly as written. Nothing is promoted, merged, or upgraded by the board.</text></g><g transform="translate(60,1382)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">What this round taught us — all of it found by attacking our own work</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Six defects, logged as corrections C-046 and C-053 to C-056, each with the fix and a test that proves the fix.</text><text x="504" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">A bar chart whose bars were invisible</text><rect x="520" y="135" width="330" height="18" fill="#b03822"/><text x="1524" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><text x="1594" y="148" font-family="Anek Latin" font-size="14" fill="#525252">1.4:1 contrast — passed every check for weeks</text><line x1="0" y1="171" x2="2280" y2="171" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Checks that could never fail</text><rect x="520" y="179" width="990" height="18" fill="#041222"/><text x="1524" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">3</text><text x="1594" y="192" font-family="Anek Latin" font-size="14" fill="#525252">exempt by class name, wrong scope, never clicked</text><line x1="0" y1="215" x2="2280" y2="215" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Colour tests silently switched off</text><rect x="520" y="223" width="330" height="18" fill="#041222"/><text x="1524" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><text x="1594" y="236" font-family="Anek Latin" font-size="14" fill="#525252">backslashes eaten twice; reported clean while testing nothing</text><line x1="0" y1="259" x2="2280" y2="259" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="280" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Wrong company credited for a finding</text><rect x="520" y="267" width="330" height="18" fill="#041222"/><text x="1524" y="281" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><text x="1594" y="280" font-family="Anek Latin" font-size="14" fill="#525252">found by an agent that was looking for something else</text><line x1="0" y1="303" x2="2280" y2="303" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="340" font-family="Anek Latin" font-size="16" fill="#041222">None of these were found by whoever wrote them. Every one was found by an agent sent in specifically to attack the work.</text></g><line x1="60" y1="1792" x2="2340" y2="1792" stroke="#041222" stroke-width="2"/><text x="60" y="1858" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What this means</text><rect x="60" y="1881" width="22" height="22" fill="#041222"/><text x="67" y="1898" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="98" y="1899" font-family="Anek Latin" font-size="17" fill="#041222">Every one of the 121 findings resolves to a named capture</text><text x="98" y="1923" font-family="Anek Latin" font-size="17" fill="#041222">file. Nothing on the board is unsourced.</text><rect x="60" y="1947" width="22" height="22" fill="#041222"/><text x="67" y="1964" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="98" y="1965" font-family="Anek Latin" font-size="17" fill="#041222">Confidence is transcribed, never interpreted. The board</text><text x="98" y="1989" font-family="Anek Latin" font-size="17" fill="#041222">cannot promote a weak finding into a strong one.</text><rect x="60" y="2013" width="22" height="22" fill="#041222"/><text x="67" y="2030" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="98" y="2031" font-family="Anek Latin" font-size="17" fill="#041222">The defects that mattered were invisible to every automatic</text><text x="98" y="2055" font-family="Anek Latin" font-size="17" fill="#041222">check and were found by attacking the work.</text><rect x="60" y="2079" width="22" height="22" fill="#041222"/><text x="67" y="2096" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="98" y="2097" font-family="Anek Latin" font-size="17" fill="#041222">A bar chart shipped for weeks with bars at 1.4:1 — visually</text><text x="98" y="2121" font-family="Anek Latin" font-size="17" fill="#041222">invisible — while passing every check.</text><text x="1230" y="1858" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What to do next</text><rect x="1230" y="1881" width="22" height="22" fill="#b03822"/><text x="1237" y="1898" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="1268" y="1899" font-family="Anek Latin" font-size="17" fill="#041222">Run round 2 on the 41 highest-value gaps that round 1 left</text><text x="1268" y="1923" font-family="Anek Latin" font-size="17" fill="#041222">blank.</text><rect x="1230" y="1947" width="22" height="22" fill="#b03822"/><text x="1237" y="1964" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="1268" y="1965" font-family="Anek Latin" font-size="17" fill="#041222">Bring the two verifiers under the machinery hash; today they</text><text x="1268" y="1989" font-family="Anek Latin" font-size="17" fill="#041222">check the work but nothing checks them.</text><rect x="1230" y="2013" width="22" height="22" fill="#b03822"/><text x="1237" y="2030" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="1268" y="2031" font-family="Anek Latin" font-size="17" fill="#041222">Keep the attack step. It found six real defects that six</text><text x="1268" y="2055" font-family="Anek Latin" font-size="17" fill="#041222">weeks of green checks did not.</text><rect x="1230" y="2079" width="22" height="22" fill="#b03822"/><text x="1237" y="2096" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="1268" y="2097" font-family="Anek Latin" font-size="17" fill="#041222">Decide whether the evidence ledger gets populated, or stop</text><text x="1268" y="2121" font-family="Anek Latin" font-size="17" fill="#041222">claiming the Design Loop is runnable.</text><line x1="60" y1="2188" x2="2340" y2="2188" stroke="#e0e0e0" stroke-width="1"/><text x="60" y="2236" font-family="Anek Latin" font-size="14" fill="#525252">CoForge · measured from the git history and the session logs on 2026-09-08 · every transcript record counted once · dollars are illustrative at Opus 5 list price and were never billed</text></svg>