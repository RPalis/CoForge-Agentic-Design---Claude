<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2510" viewBox="0 0 2400 2510"><rect x="0" y="0" width="2400" height="2510" fill="#eeece6"/><text x="60" y="90" font-family="Source Code Pro" font-size="15" font-weight="600" fill="#525252" letter-spacing="1">REPORT 2 · FRAME 4 OF 4</text><text x="60" y="166" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" letter-spacing="-1.6">AGENTIC CONTRACT</text><text x="60" y="232" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" letter-spacing="-1.6">&amp; ADOPTION</text><text x="60" y="278" font-family="Anek Latin" font-size="19" fill="#525252">The promises the system makes, and how much of it is actually being used.</text><text x="60" y="308" font-family="Anek Latin" font-size="19" fill="#525252">The contract is short on purpose: two prohibitions, two sources of truth, and one way in.</text><line x1="60.0" y1="324.0" x2="2340.0" y2="324.0" stroke="#041222" stroke-width="2"/><g transform="translate(60,370)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">Who actually catches the mistakes</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">All 57 logged mistakes, sorted by who found them. Coral marks the source you cannot rely on.</text><text x="624" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">An agent sent in to check someone else's work</text><rect x="640" y="135" width="1550" height="18" fill="#041222"/><text x="2204" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">26</text><line x1="0.0" y1="179.0" x2="2280.0" y2="179.0" stroke="#e0e0e0" stroke-width="1"/><text x="624" y="200" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">An automatic check, firing on its own</text><rect x="640" y="187" width="298.1" height="18" fill="#041222"/><text x="2204" y="201" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">5</text><line x1="0.0" y1="231.0" x2="2280.0" y2="231.0" stroke="#e0e0e0" stroke-width="1"/><text x="624" y="252" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">You, by asking a question</text><rect x="640" y="239" width="357.7" height="18" fill="#041222"/><text x="2204" y="253" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">6</text><line x1="0.0" y1="283.0" x2="2280.0" y2="283.0" stroke="#e0e0e0" stroke-width="1"/><text x="624" y="304" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Whoever made the mistake, catching it themselves</text><rect x="640" y="291" width="1192.3" height="18" fill="#b03822"/><text x="2204" y="305" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">20</text><line x1="0.0" y1="335.0" x2="2280.0" y2="335.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="376" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222">37 of 57 mistakes — 65% — were found by someone other than whoever made them.</text><text x="0" y="402" font-family="Anek Latin" font-size="16" fill="#525252">This is the single most useful thing this project knows about itself. People and agents are bad at auditing their own work, and good at auditing each other's. The whole system is built around that one fact.</text></g><g transform="translate(60,844)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">219 components exist. We designed eleven of them.</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Counted from design-system/component-index.json.</text><text x="544" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Bought in — a vendor library we ingested</text><rect x="560" y="135" width="1160" height="18" fill="#041222"/><text x="1734" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">208</text><text x="1834" y="148" font-family="Anek Latin" font-size="14" fill="#525252">@carbon/react</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Built here, and approved through the process</text><rect x="560" y="179" width="61.3" height="18" fill="#b03822"/><text x="1734" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">11</text><text x="1834" y="192" font-family="Anek Latin" font-size="14" fill="#525252">CoForge L1 primitives</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="254" font-family="Anek Latin" font-size="16" fill="#041222">This is why the design system is still declared RED. 208 components arrived in one import; they are a catalogue, not a system anyone here designed.</text><text x="0" y="278" font-family="Anek Latin" font-size="16" fill="#525252">A component only counts once a person has approved it and a written decision records why. Eleven have made it through.</text></g><g transform="translate(60,1192)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">33 deliverables produced; 2 have a human signature on them</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Every deliverable carries a status. Nothing is 'done' until a person says so — that is Gate A.</text><text x="544" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Draft — made, not yet reviewed</text><rect x="560" y="135" width="1630" height="18" fill="#041222"/><text x="2204" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">20</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Superseded — replaced by a newer version</text><rect x="560" y="179" width="652" height="18" fill="#041222"/><text x="2204" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">8</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">In review — with a person now</text><rect x="560" y="223" width="244.5" height="18" fill="#041222"/><text x="2204" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">3</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="280" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Approved — signed off by a human</text><rect x="560" y="267" width="163" height="18" fill="#b03822"/><text x="2204" y="281" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">2</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="340" font-family="Anek Latin" font-size="16" fill="#041222">2 of 33 deliverables have been approved by a person. The rest are waiting, or were replaced.</text></g><g transform="translate(60,1602)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">The system learns by writing its mistakes down</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">57 mistakes have produced 11 standing rules. The newest, SR-11: “A check that cannot fail is not a check.”</text><text x="504" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Mistakes logged, each with a fix</text><rect x="520" y="135" width="1670" height="18" fill="#041222"/><text x="2204" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">57</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Rules distilled from them</text><rect x="520" y="179" width="322.3" height="18" fill="#041222"/><text x="2204" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">11</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Written decisions (ADRs)</text><rect x="520" y="223" width="644.6" height="18" fill="#041222"/><text x="2204" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">22</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="280" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Audit reports written</text><rect x="520" y="267" width="937.5" height="18" fill="#041222"/><text x="2204" y="281" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">32</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="340" font-family="Anek Latin" font-size="16" fill="#041222">A mistake that happens twice becomes a rule. The rules are injected into all 14 agent briefings automatically, and the build fails if one is missing.</text></g><line x1="60.0" y1="2012.0" x2="2340.0" y2="2012.0" stroke="#041222" stroke-width="2"/><text x="60" y="2078" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What this means</text><rect x="60" y="2101" width="22" height="22" fill="#041222"/><text x="67" y="2118" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="98" y="2119" font-family="Anek Latin" font-size="17" fill="#041222">65% of mistakes were found by someone other than whoever made</text><text x="98" y="2143" font-family="Anek Latin" font-size="17" fill="#041222">them. That single fact is the design.</text><rect x="60" y="2167" width="22" height="22" fill="#041222"/><text x="67" y="2184" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="98" y="2185" font-family="Anek Latin" font-size="17" fill="#041222">The design system is still RED: 208 of 219 components were</text><text x="98" y="2209" font-family="Anek Latin" font-size="17" fill="#041222">bought in, not designed here.</text><rect x="60" y="2233" width="22" height="22" fill="#041222"/><text x="67" y="2250" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="98" y="2251" font-family="Anek Latin" font-size="17" fill="#041222">2 of 33 deliverables carry a human signature. Everything else</text><text x="98" y="2275" font-family="Anek Latin" font-size="17" fill="#041222">is draft or superseded.</text><rect x="60" y="2299" width="22" height="22" fill="#041222"/><text x="67" y="2316" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="98" y="2317" font-family="Anek Latin" font-size="17" fill="#041222">57 mistakes have been distilled into 11 rules, and the rules</text><text x="98" y="2341" font-family="Anek Latin" font-size="17" fill="#041222">reach all 14 agents automatically.</text><text x="1230" y="2078" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What to do next</text><rect x="1230" y="2101" width="22" height="22" fill="#b03822"/><text x="1237" y="2118" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="1268" y="2119" font-family="Anek Latin" font-size="17" fill="#041222">Never let the author of a change be the one who clears it. It</text><text x="1268" y="2143" font-family="Anek Latin" font-size="17" fill="#041222">is the highest-yield rule here.</text><rect x="1230" y="2167" width="22" height="22" fill="#b03822"/><text x="1237" y="2184" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="1268" y="2185" font-family="Anek Latin" font-size="17" fill="#041222">Author and promote real L2 components, or stop describing the</text><text x="1268" y="2209" font-family="Anek Latin" font-size="17" fill="#041222">index as a design system.</text><rect x="1230" y="2233" width="22" height="22" fill="#b03822"/><text x="1237" y="2250" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="1268" y="2251" font-family="Anek Latin" font-size="17" fill="#041222">Move the finished deliverables through Gate A so 'approved'</text><text x="1268" y="2275" font-family="Anek Latin" font-size="17" fill="#041222">means something.</text><rect x="1230" y="2299" width="22" height="22" fill="#b03822"/><text x="1237" y="2316" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="1268" y="2317" font-family="Anek Latin" font-size="17" fill="#041222">Populate the evidence ledger — it is the one source of truth</text><text x="1268" y="2341" font-family="Anek Latin" font-size="17" fill="#041222">that is still empty.</text><line x1="60.0" y1="2408.0" x2="2340.0" y2="2408.0" stroke="#e0e0e0" stroke-width="1"/><text x="60" y="2456" font-family="Anek Latin" font-size="14" fill="#525252">CoForge · measured from the git history and the session logs, frozen at 2026-09-08 12:11 UTC (the last record in the corpus, not the time the script ran) · every transcript record counted once, keyed on message uuid · dollars are illustrative at Opus 5 list price and were never billed</text><text x="60" y="2478" font-family="Anek Latin" font-size="14" fill="#525252">The repository counts do not include this report: it was committed after the figures were frozen, so the artifact and commit totals here are one behind by construction.</text></svg>