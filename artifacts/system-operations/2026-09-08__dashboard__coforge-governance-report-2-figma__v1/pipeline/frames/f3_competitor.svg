<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2290" viewBox="0 0 2400 2290"><rect x="0.0" y="0.0" width="2400.0" height="2290.0" fill="#eeece6"/><text x="60.0" y="90.0" font-family="Source Code Pro" font-size="15" font-weight="600" fill="#525252" text-anchor="start" letter-spacing="1">REPORT 2 · FRAME 3 OF 4</text><text x="60.0" y="166.0" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-1.6">COMPETITOR ANALYSIS</text><text x="60.0" y="212.0" font-family="Anek Latin" font-size="19" font-weight="400" fill="#525252" text-anchor="start">Deliverable #1, start to finish: 17 competitors, 50 capture files, 121 findings, and what went wrong on the way.</text><text x="60.0" y="242.0" font-family="Anek Latin" font-size="19" font-weight="400" fill="#525252" text-anchor="start">This is the first time the whole system was pointed at a real piece of work.</text><line x1="60.0" y1="258.0" x2="2340.0" y2="258.0" stroke="#041222" stroke-width="2"/><g transform="translate(60,304)"><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">How Deliverable #1 was actually run, start to finish</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Seven steps. The last two are the ones most processes leave out.</text><rect x="0.0" y="128.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="158.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">1</text><text x="70.0" y="148.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Plan</text><text x="70.0" y="170.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">research-plan written and approved</text><text x="2280.0" y="158.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">ART-024</text><line x1="23.0" y1="174.0" x2="23.0" y2="202.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="202.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="232.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">2</text><text x="70.0" y="222.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Capture</text><text x="70.0" y="244.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">17 competitors visited in two browsers, 50 files written</text><text x="2280.0" y="232.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">ART-025</text><line x1="23.0" y1="248.0" x2="23.0" y2="276.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="276.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="306.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">3</text><text x="70.0" y="296.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Index</text><text x="70.0" y="318.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">121 findings extracted, each tied to a named file</text><text x="2280.0" y="306.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">CAPTURE-INDEX</text><line x1="23.0" y1="322.0" x2="23.0" y2="350.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="350.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="380.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">4</text><text x="70.0" y="370.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Synthesise</text><text x="70.0" y="392.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">findings grouped into insights and recommendations</text><text x="2280.0" y="380.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">ART-026</text><line x1="23.0" y1="396.0" x2="23.0" y2="424.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="424.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="454.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">5</text><text x="70.0" y="444.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Chart</text><text x="70.0" y="466.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">11 charts built, then checked on the rendered page</text><text x="2280.0" y="454.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">verify-charts</text><line x1="23.0" y1="470.0" x2="23.0" y2="498.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="498.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="528.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">6</text><text x="70.0" y="518.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Attack</text><text x="70.0" y="540.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">two agents tried to break the result; both found real defects</text><text x="2280.0" y="528.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">2 reports</text><line x1="23.0" y1="544.0" x2="23.0" y2="572.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="572.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="602.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">7</text><text x="70.0" y="592.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Fix</text><text x="70.0" y="614.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">every defect fixed, then re-planted to prove the fix works</text><text x="2280.0" y="602.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">C-053–C-056</text></g><g transform="translate(60,1016)"><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">121 findings, and every one carries the confidence its capture file gave it</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Deliverable #1 — hands-on competitor capture, 17 competitors, 50 capture files.</text><text x="544.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Verified — exact quote from a capture file</text><rect x="560.0" y="135.0" width="1220.0" height="18.0" fill="#041222"/><text x="1794.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">101</text><text x="1894.0" y="148.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">83% of all findings</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="544.0" y="192.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Verified — but qualified in the source</text><rect x="560.0" y="179.0" width="157.0" height="18.0" fill="#041222"/><text x="1794.0" y="193.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">13</text><text x="1894.0" y="192.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">11%</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="544.0" y="236.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">A pointer to another file, not a claim</text><rect x="560.0" y="223.0" width="84.6" height="18.0" fill="#041222"/><text x="1794.0" y="237.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">7</text><text x="1894.0" y="236.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">6%</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="296.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">Confidence is copied from the capture file exactly as written. Nothing is promoted, merged, or upgraded by the board.</text></g><g transform="translate(60,1382)"><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">What this round taught us — all of it found by attacking our own work</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Six defects across five corrections — C-046, and C-053 to C-056 — each with its fix and a test that proves the fix bites.</text><text x="504.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">A bar chart whose bars were invisible</text><rect x="520.0" y="135.0" width="330.0" height="18.0" fill="#b03822"/><text x="1524.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">1</text><text x="1594.0" y="148.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">1.45:1 contrast — passed every check for weeks</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="192.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Checks that could never fail</text><rect x="520.0" y="179.0" width="990.0" height="18.0" fill="#041222"/><text x="1524.0" y="193.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">3</text><text x="1594.0" y="192.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">exempt by class name, wrong scope, never clicked</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="236.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Colour tests silently switched off</text><rect x="520.0" y="223.0" width="330.0" height="18.0" fill="#041222"/><text x="1524.0" y="237.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">1</text><text x="1594.0" y="236.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">backslashes eaten twice; reported clean while testing nothing</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="280.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Wrong company credited for a finding</text><rect x="520.0" y="267.0" width="330.0" height="18.0" fill="#041222"/><text x="1524.0" y="281.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">1</text><text x="1594.0" y="280.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">found by an agent that was looking for something else</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="340.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">None of these were found by whoever wrote them. Every one was found by an agent sent in specifically to attack the work.</text></g><line x1="60.0" y1="1792.0" x2="2340.0" y2="1792.0" stroke="#041222" stroke-width="2"/><text x="60.0" y="1858.0" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.6">What this means</text><rect x="60.0" y="1881.0" width="22.0" height="22.0" fill="#041222"/><text x="67.0" y="1898.0" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6" text-anchor="start">1</text><text x="98.0" y="1899.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">Every one of the 121 findings resolves to a named capture</text><text x="98.0" y="1923.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">file. Nothing on the board is unsourced.</text><rect x="60.0" y="1947.0" width="22.0" height="22.0" fill="#041222"/><text x="67.0" y="1964.0" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6" text-anchor="start">2</text><text x="98.0" y="1965.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">Confidence is transcribed, never interpreted. The board</text><text x="98.0" y="1989.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">cannot promote a weak finding into a strong one.</text><rect x="60.0" y="2013.0" width="22.0" height="22.0" fill="#041222"/><text x="67.0" y="2030.0" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6" text-anchor="start">3</text><text x="98.0" y="2031.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">The defects that mattered were invisible to every automatic</text><text x="98.0" y="2055.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">check and were found by attacking the work.</text><rect x="60.0" y="2079.0" width="22.0" height="22.0" fill="#041222"/><text x="67.0" y="2096.0" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6" text-anchor="start">4</text><text x="98.0" y="2097.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">A bar chart shipped for weeks with bars at 1.45:1 — visually</text><text x="98.0" y="2121.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">invisible — while passing every check.</text><text x="1230.0" y="1858.0" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.6">What to do next</text><rect x="1230.0" y="1881.0" width="22.0" height="22.0" fill="#b03822"/><text x="1237.0" y="1898.0" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6" text-anchor="start">1</text><text x="1268.0" y="1899.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">Run round 2 on the 41 highest-value gaps that round 1 left</text><text x="1268.0" y="1923.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">blank.</text><rect x="1230.0" y="1947.0" width="22.0" height="22.0" fill="#b03822"/><text x="1237.0" y="1964.0" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6" text-anchor="start">2</text><text x="1268.0" y="1965.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">Bring the two verifiers under the machinery hash; today they</text><text x="1268.0" y="1989.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">check the work but nothing checks them.</text><rect x="1230.0" y="2013.0" width="22.0" height="22.0" fill="#b03822"/><text x="1237.0" y="2030.0" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6" text-anchor="start">3</text><text x="1268.0" y="2031.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">Keep the attack step. It found six real defects that six</text><text x="1268.0" y="2055.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">weeks of green checks did not.</text><rect x="1230.0" y="2079.0" width="22.0" height="22.0" fill="#b03822"/><text x="1237.0" y="2096.0" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6" text-anchor="start">4</text><text x="1268.0" y="2097.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">Decide whether the evidence ledger gets populated, or stop</text><text x="1268.0" y="2121.0" font-family="Anek Latin" font-size="17" font-weight="400" fill="#041222" text-anchor="start">claiming the Design Loop is runnable.</text><line x1="60.0" y1="2188.0" x2="2340.0" y2="2188.0" stroke="#e0e0e0" stroke-width="1"/><text x="60.0" y="2236.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">CoForge · measured from the git history and the session logs, frozen at 2026-09-08 12:11 UTC (the last record in the corpus, not the time the script ran) · every transcript record counted once, keyed on message uuid · dollars are illustrative at Opus 5 list price and were never billed</text><text x="60.0" y="2258.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">The repository counts do not include this report: it was committed after the figures were frozen, so the artifact and commit totals here are one behind by construction.</text></svg>