<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="384" viewBox="0 0 2280 384"><rect x="0.0" y="0.0" width="2280.0" height="384.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">66 percent of the cost is the agents re-reading their own conversation</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Illustrative only — nothing was billed at these rates. Opus 5 list price, one-hour cache. Total $2,278.</text><text x="454.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Re-reading the conversation each turn</text><rect x="470.0" y="135.0" width="1220.0" height="18.0" fill="#b03822"/><text x="1704.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">$1,502</text><text x="1824.0" y="148.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">3.00B tokens at $0.50 per million</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="454.0" y="192.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Writing to the cache</text><rect x="470.0" y="179.0" width="478.7" height="18.0" fill="#041222"/><text x="1704.0" y="193.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">$589</text><text x="1824.0" y="192.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">58.9M tokens at $10.00 per million</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="454.0" y="236.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">What the agents actually wrote</text><rect x="470.0" y="223.0" width="151.2" height="18.0" fill="#041222"/><text x="1704.0" y="237.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">$186</text><text x="1824.0" y="236.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">7.45M tokens at $25.00 per million</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="454.0" y="280.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Fresh input</text><rect x="470.0" y="267.0" width="0.0" height="18.0" fill="#041222"/><text x="1704.0" y="281.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">$0</text><text x="1824.0" y="280.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">11,772 tokens at $5.00 per million</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="338.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">A long agent session re-sends the whole conversation every single turn, so the same words are paid for again and again.</text><text x="0.0" y="362.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">That re-reading is 66% of the bill. The work the agents actually produced is 8%.</text></svg>