<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="726" viewBox="0 0 2280 726"><rect x="0.0" y="0.0" width="2280.0" height="726.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">Four phases: build the system, give it a design language, move that language into Figma, then point it at real work</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Every figure below is counted from the git history and the session logs. Nothing is estimated.</text><text x="0.0" y="104.0" font-family="Anek Latin" font-size="15" font-weight="400" fill="#525252" text-anchor="start">Each column is scaled against itself. Comparing across columns is meaningless — that is why they are five charts, not one.</text><text x="430.0" y="130.0" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252" text-anchor="start">Active time</text><text x="800.0" y="130.0" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252" text-anchor="start">Your turns</text><text x="1170.0" y="130.0" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252" text-anchor="start">Commits</text><text x="1540.0" y="130.0" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252" text-anchor="start">Words written by the agents</text><text x="1910.0" y="130.0" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252" text-anchor="start">Illustrative cost</text><line x1="0.0" y1="140.0" x2="2280.0" y2="140.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="170.0" font-family="Anek Latin" font-size="21" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.3">P1 · Agentic creation</text><text x="0.0" y="194.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="start">2026-08-25 → 2026-08-27  ·  3 active days</text><text x="0.0" y="218.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">The system that builds: 14 agents, the routing</text><text x="0.0" y="236.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">table, Gate A/B, the artifact taxonomy, ADR-001</text><text x="0.0" y="254.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">to ADR-014.</text><rect x="430.0" y="158.0" width="150.3" height="20.0" fill="#041222"/><text x="430.0" y="204.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">5.1h</text><rect x="800.0" y="158.0" width="126.9" height="20.0" fill="#041222"/><text x="800.0" y="204.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">75</text><rect x="1170.0" y="158.0" width="45.5" height="20.0" fill="#041222"/><text x="1170.0" y="204.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">4</text><rect x="1540.0" y="158.0" width="174.4" height="20.0" fill="#041222"/><text x="1540.0" y="204.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">1.92M</text><rect x="1910.0" y="158.0" width="155.0" height="20.0" fill="#041222"/><text x="1910.0" y="204.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">$500</text><line x1="0.0" y1="272.0" x2="2280.0" y2="272.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="302.0" font-family="Anek Latin" font-size="21" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.3">P2 · DS Foundations</text><text x="0.0" y="326.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="start">2026-08-28 → 2026-08-31  ·  2 active days</text><text x="0.0" y="350.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">Brand approved at Gate A, 829 tokens across</text><text x="0.0" y="368.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">five axes, and the first L1 primitives.</text><rect x="430.0" y="290.0" width="106.1" height="20.0" fill="#041222"/><text x="430.0" y="336.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">3.6h</text><rect x="800.0" y="290.0" width="170.9" height="20.0" fill="#041222"/><text x="800.0" y="336.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">101</text><rect x="1170.0" y="290.0" width="330.0" height="20.0" fill="#041222"/><text x="1170.0" y="336.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">29</text><rect x="1540.0" y="290.0" width="71.5" height="20.0" fill="#041222"/><text x="1540.0" y="336.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">0.79M</text><rect x="1910.0" y="290.0" width="122.5" height="20.0" fill="#041222"/><text x="1910.0" y="336.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">$395</text><line x1="0.0" y1="404.0" x2="2280.0" y2="404.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="434.0" font-family="Anek Latin" font-size="21" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.3">P3 · Figma migration</text><text x="0.0" y="458.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="start">2026-09-01 → 2026-09-02  ·  2 active days</text><text x="0.0" y="482.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">Token release 0.2.0 is cut, tokens reach Figma</text><text x="0.0" y="500.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">as variables, the Carbon adapter lands 208</text><text x="0.0" y="518.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">components, CI runs the audit on a real PR.</text><rect x="430.0" y="422.0" width="112.0" height="20.0" fill="#041222"/><text x="430.0" y="468.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">3.8h</text><rect x="800.0" y="422.0" width="123.5" height="20.0" fill="#041222"/><text x="800.0" y="468.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">73</text><rect x="1170.0" y="422.0" width="216.2" height="20.0" fill="#041222"/><text x="1170.0" y="468.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">19</text><rect x="1540.0" y="422.0" width="101.8" height="20.0" fill="#041222"/><text x="1540.0" y="468.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">1.12M</text><rect x="1910.0" y="422.0" width="98.7" height="20.0" fill="#041222"/><text x="1910.0" y="468.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">$318</text><line x1="0.0" y1="536.0" x2="2280.0" y2="536.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="566.0" font-family="Anek Latin" font-size="21" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.3">P4 · First application</text><text x="0.0" y="590.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="start">2026-09-03 → 2026-09-08  ·  4 active days</text><text x="0.0" y="614.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">The system is pointed at real work: Batch 3,</text><text x="0.0" y="632.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">capture round 1 across 17 competitors, the</text><text x="0.0" y="650.0" font-family="Anek Latin" font-size="13" font-weight="400" fill="#525252" text-anchor="start">findings dashboard.</text><rect x="430.0" y="554.0" width="330.0" height="20.0" fill="#041222"/><text x="430.0" y="600.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">11.2h</text><rect x="800.0" y="554.0" width="330.0" height="20.0" fill="#041222"/><text x="800.0" y="600.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">195</text><rect x="1170.0" y="554.0" width="330.0" height="20.0" fill="#041222"/><text x="1170.0" y="600.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">29</text><rect x="1540.0" y="554.0" width="330.0" height="20.0" fill="#041222"/><text x="1540.0" y="600.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">3.63M</text><rect x="1910.0" y="554.0" width="330.0" height="20.0" fill="#041222"/><text x="1910.0" y="600.0" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222" text-anchor="start">$1,064</text><line x1="0.0" y1="668.0" x2="2280.0" y2="668.0" stroke="#6f6f6f" stroke-width="1"/><text x="0.0" y="698.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">Each phase's hours are rounded on their own, so the four add up to 23.7h against an exact total of 23.6h. The total is the measured figure; the parts are the rounded ones.</text></svg>