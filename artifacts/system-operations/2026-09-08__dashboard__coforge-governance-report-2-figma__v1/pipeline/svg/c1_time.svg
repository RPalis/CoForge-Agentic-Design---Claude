<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="276" viewBox="0 0 2280 276"><rect x="0.0" y="0.0" width="2280.0" height="276.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">“How long did this take?” has two honest answers, 4 times apart</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">This is why the number is defined on the board rather than just printed. An undefined metric cannot be compared to anything.</text><text x="454.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Minutes with something actually happening</text><rect x="470.0" y="135.0" width="292.1" height="18.0" fill="#b03822"/><text x="1624.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">23.6h</text><text x="1734.0" y="148.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">counts a minute once, however busy it was</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="454.0" y="192.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">First to last activity each day</text><rect x="470.0" y="179.0" width="1140.0" height="18.0" fill="#041222"/><text x="1624.0" y="193.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">92.1h</text><text x="1734.0" y="192.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">includes every gap inside a working day</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="252.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">Both are honest; they answer different questions. The board uses the first, because it is the one that cannot flatter.</text></svg>