<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="772" viewBox="0 0 2280 772"><rect x="0.0" y="0.0" width="2280.0" height="772.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">11 of the fourteen agents have done real work; 3 are waiting for a phase that has not happened</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">How many times each agent was handed a task, counted from the session logs. 55 dispatches to these fourteen; 10 more went to general-purpose helpers that sit outside the roster.</text><text x="414.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">system-keeper</text><rect x="430.0" y="135.0" width="1760.0" height="18.0" fill="#041222"/><text x="2204.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">16</text><line x1="0.0" y1="167.0" x2="2280.0" y2="167.0" stroke="#e0e0e0" stroke-width="1"/><text x="414.0" y="188.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">dashboard-analyst</text><rect x="430.0" y="175.0" width="990.0" height="18.0" fill="#041222"/><text x="2204.0" y="189.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">9</text><line x1="0.0" y1="207.0" x2="2280.0" y2="207.0" stroke="#e0e0e0" stroke-width="1"/><text x="414.0" y="228.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">token-keeper</text><rect x="430.0" y="215.0" width="990.0" height="18.0" fill="#041222"/><text x="2204.0" y="229.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">9</text><line x1="0.0" y1="247.0" x2="2280.0" y2="247.0" stroke="#e0e0e0" stroke-width="1"/><text x="414.0" y="268.0" f