<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="500" viewBox="0 0 2280 500"><rect x="0.0" y="0.0" width="2280.0" height="500.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">Six ways to stop a mistake, ranked by how hard they are to ignore</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">The rule of the system: never solve with a written rule what a permission can solve.</text><text x="0.0" y="104.0" font-family="Anek Latin" font-size="15" font-weight="400" fill="#525252" text-anchor="start">Strongest at the top. Prose is the weakest layer, which is why only two rules live there.</text><line x1="0.0" y1="118.0" x2="2280.0" y2="118.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="144.0" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222" text-anchor="start">1 · Impossible</text><text x="300.0" y="144.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">The agent is never given the tool</text><text x="1120.0" y="144.0" font-family="Source Code Pro" font-size="15" font-weight="400" fill="#525252" text-anchor="start">.claude/settings.json</text><text x="2280.0" y="144.0" font-family="Anek Latin" font-size="15" font-weight="400" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="172.0" x2="2280.0" y2="172.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="198.0" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222" text-anchor="start">2 · Blocked</text><text x="300.0" y="198.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">The save is refused before it happens</text><text x="1120.0" y="198.0" font-family="Source Code Pro" font-size="15" font-weight="400" fill="#525252" text-anchor="start">.claude/hooks/gate-b.py</text><text x="2280.0" y="198.0" font-family="Anek Latin" font-size="15" font-weight="400" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="226.0" x2="2280.0" y2="226.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="252.0" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222" text-anchor="start">2b · Backstop</text><text x="300.0" y="252.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">Catches writes that dodge layer 2</text><text x="1120.0" y="252.0" font-family="Source Code Pro" font-size="15" font-weight="400" fill="#525252" text-anchor="start">.claude/hooks/session-check.py</text><text x="2280.0" y="252.0" font-family="Anek Latin" font-size="15" font-weight="400" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="280.0" x2="2280.0" y2="280.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="306.0" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222" text-anchor="start">3 · Failed</text><text x="300.0" y="306.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">The build goes red after the fact</text><text x="1120.0" y="306.0" font-family="Source Code Pro" font-size="15" font-weight="400" fill="#525252" text-anchor="start">.github/workflows/ci.yml</text><text x="2280.0" y="306.0" font-family="Anek Latin" font-size="15" font-weight="400" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="334.0" x2="2280.0" y2="334.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="360.0" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222" text-anchor="start">4 · Visible</text><text x="300.0" y="360.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">Someone can see it went wrong</text><text x="1120.0" y="360.0" font-family="Source Code Pro" font-size="15" font-weight="400" fill="#525252" text-anchor="start">validation/reports/</text><text x="2280.0" y="360.0" font-family="Anek Latin" font-size="15" font-weight="400" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="388.0" x2="2280.0" y2="388.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="414.0" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222" text-anchor="start">5 · Written</text><text x="300.0" y="414.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">A rule in prose, and nothing more</text><text x="1120.0" y="414.0" font-family="Source Code Pro" font-size="15" font-weight="400" fill="#525252" text-anchor="start">CLAUDE.md — two prohibitions</text><text x="2280.0" y="414.0" font-family="Anek Latin" font-size="15" font-weight="400" fill="#b03822" text-anchor="end">enforced by nobody</text><line x1="0.0" y1="442.0" x2="2280.0" y2="442.0" stroke="#6f6f6f" stroke-width="1"/><text x="0.0" y="476.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">Every layer names a real file. A layer that named nothing would read as coverage while protecting nothing — which is the exact failure this list was built to prevent.</text></svg>