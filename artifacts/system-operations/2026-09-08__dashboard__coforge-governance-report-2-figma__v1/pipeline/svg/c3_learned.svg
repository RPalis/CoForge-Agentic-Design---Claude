<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="364" viewBox="0 0 2280 364"><rect x="0.0" y="0.0" width="2280.0" height="364.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">What this round taught us — all of it found by attacking our own work</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Six defects across five corrections — C-046, and C-053 to C-056 — each with its fix and a test that proves the fix bites.</text><text x="504.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">A bar chart whose bars were invisible</text><rect x="520.0" y="135.0" width="330.0" height="18.0" fill="#b03822"/><text x="1524.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">1</text><text x="1594.0" y="148.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">1.45:1 contrast — passed every check for weeks</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="192.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Checks that could never fail</text><rect x="520.0" y="179.0" width="990.0" height="18.0" fill="#041222"/><text x="1524.0" y="193.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">3</text><text x="1594.0" y="192.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">exempt by class name, wrong scope, never clicked</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="236.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Colour tests silently switched off</text><rect x="520.0" y="223.0" width="330.0" height="18.0" fill="#041222"/><text x="1524.0" y="237.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">1</text><text x="1594.0" y="236.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">backslashes eaten twice; reported clean while testing nothing</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="280.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Wrong company credited for a finding</text><rect x="520.0" y="267.0" width="330.0" height="18.0" fill="#041222"/><text x="1524.0" y="281.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">1</text><text x="1594.0" y="280.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">found by an agent that was looking for something else</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="340.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">None of these were found by whoever wrote them. Every one was found by an agent sent in specifically to attack the work.</text></svg>