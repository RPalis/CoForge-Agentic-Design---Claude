<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="666" viewBox="0 0 2280 666"><rect x="0.0" y="0.0" width="2280.0" height="666.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">How Deliverable #1 was actually run, start to finish</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Seven steps. The last two are the ones most processes leave out.</text><rect x="0.0" y="128.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="158.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">1</text><text x="70.0" y="148.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Plan</text><text x="70.0" y="170.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">research-plan written and approved</text><text x="2280.0" y="158.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">ART-024</text><line x1="23.0" y1="174.0" x2="23.0" y2="202.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="202.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="232.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">2</text><text x="70.0" y="222.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Capture</text><text x="70.0" y="244.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">17 competitors visited in two browsers, 50 files written</text><text x="2280.0" y="232.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">ART-025</text><line x1="23.0" y1="248.0" x2="23.0" y2="276.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="276.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="306.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">3</text><text x="70.0" y="296.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Index</text><text x="70.0" y="318.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">121 findings extracted, each tied to a named file</text><text x="2280.0" y="306.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">CAPTURE-INDEX</text><line x1="23.0" y1="322.0" x2="23.0" y2="350.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="350.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="380.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">4</text><text x="70.0" y="370.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Synthesise</text><text x="70.0" y="392.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">findings grouped into insights and recommendations</text><text x="2280.0" y="380.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">ART-026</text><line x1="23.0" y1="396.0" x2="23.0" y2="424.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="424.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="454.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">5</text><text x="70.0" y="444.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Chart</text><text x="70.0" y="466.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">11 charts built, then checked on the rendered page</text><text x="2280.0" y="454.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">verify-charts</text><line x1="23.0" y1="470.0" x2="23.0" y2="498.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="498.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="528.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">6</text><text x="70.0" y="518.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Attack</text><text x="70.0" y="540.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">two agents tried to break the result; both found real defects</text><text x="2280.0" y="528.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">2 reports</text><line x1="23.0" y1="544.0" x2="23.0" y2="572.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0.0" y="572.0" width="46.0" height="46.0" fill="#041222"/><text x="23.0" y="602.0" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">7</text><text x="70.0" y="592.0" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222" text-anchor="start">Fix</text><text x="70.0" y="614.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">every defect fixed, then re-planted to prove the fix works</text><text x="2280.0" y="602.0" font-family="Source Code Pro" font-size="14" font-weight="400" fill="#525252" text-anchor="end">C-053–C-056</text></svg>