<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="302" viewBox="0 0 2280 302"><rect x="0.0" y="0.0" width="2280.0" height="302.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">219 components exist. We designed eleven of them.</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">Counted from design-system/component-index.json.</text><text x="544.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Bought in — a vendor library we ingested</text><rect x="560.0" y="135.0" width="1160.0" height="18.0" fill="#041222"/><text x="1734.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">208</text><text x="1834.0" y="148.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">@carbon/react</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="544.0" y="192.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Built here, and approved through the process</text><rect x="560.0" y="179.0" width="61.3" height="18.0" fill="#b03822"/><text x="1734.0" y="193.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">11</text><text x="1834.0" y="192.0" font-family="Anek Latin" font-size="14" font-weight="400" fill="#525252" text-anchor="start">CoForge L1 primitives</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="254.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">This is why the design system is still declared RED. 208 components arrived in one import; they are a catalogue, not a system anyone here designed.</text><text x="0.0" y="278.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">A component only counts once a person has approved it and a written decision records why. Eleven have made it through.</text></svg>