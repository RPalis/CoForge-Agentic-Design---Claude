<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="428" viewBox="0 0 2280 428"><rect x="0.0" y="0.0" width="2280.0" height="428.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">Who actually catches the mistakes</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">All 57 logged mistakes, sorted by who found them. Coral marks the source you cannot rely on.</text><text x="624.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">An agent sent in to check someone else's work</text><rect x="640.0" y="135.0" width="1550.0" height="18.0" fill="#041222"/><text x="2204.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">26</text><line x1="0.0" y1="179.0" x2="2280.0" y2="179.0" stroke="#e0e0e0" stroke-width="1"/><text x="624.0" y="200.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">An automatic check, firing on its own</text><rect x="640.0" y="187.0" width="298.1" height="18.0" fill="#041222"/><text x="2204.0" y="201.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">5</text><line x1="0.0" y1="231.0" x2="2280.0" y2="231.0" stroke="#e0e0e0" stroke-width="1"/><text x="624.0" y="252.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">You, by asking a question</text><rect x="640.0" y="239.0" width="357.7" height="18.0" fill="#041222"/><text x="2204.0" y="253.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">6</text><line x1="0.0" y1="283.0" x2="2280.0" y2="283.0" stroke="#e0e0e0" stroke-width="1"/><text x="624.0" y="304.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Whoever made the mistake, catching it themselves</text><rect x="640.0" y="291.0" width="1192.3" height="18.0" fill="#b03822"/><text x="2204.0" y="305.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">20</text><line x1="0.0" y1="335.0" x2="2280.0" y2="335.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="376.0" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222" text-anchor="start">37 of 57 mistakes — 65% — were found by someone other than whoever made them.</text><text x="0.0" y="402.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">This is the single most useful thing this project knows about itself. People and agents are bad at auditing their own work, and good at auditing each other's. The whole system is built around that one fact.</text></svg>