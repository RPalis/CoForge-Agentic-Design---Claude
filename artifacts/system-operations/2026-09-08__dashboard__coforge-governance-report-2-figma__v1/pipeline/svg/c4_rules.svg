<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="364" viewBox="0 0 2280 364"><rect x="0.0" y="0.0" width="2280.0" height="364.0" fill="#eeece6"/><text x="0.0" y="34.0" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" text-anchor="start" letter-spacing="-0.5">The system learns by writing its mistakes down</text><text x="0.0" y="64.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#525252" text-anchor="start">57 mistakes have produced 11 standing rules. The newest, SR-11: “A check that cannot fail is not a check.”</text><text x="504.0" y="148.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Mistakes logged, each with a fix</text><rect x="520.0" y="135.0" width="1670.0" height="18.0" fill="#041222"/><text x="2204.0" y="149.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">57</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="192.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Rules distilled from them</text><rect x="520.0" y="179.0" width="322.3" height="18.0" fill="#041222"/><text x="2204.0" y="193.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">11</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="236.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Written decisions (ADRs)</text><rect x="520.0" y="223.0" width="644.6" height="18.0" fill="#041222"/><text x="2204.0" y="237.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">22</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="504.0" y="280.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="end">Audit reports written</text><rect x="520.0" y="267.0" width="937.5" height="18.0" fill="#041222"/><text x="2204.0" y="281.0" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222" text-anchor="start">32</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0.0" y="340.0" font-family="Anek Latin" font-size="16" font-weight="400" fill="#041222" text-anchor="start">A mistake that happens twice becomes a rule. The rules are injected into all 14 agent briefings automatically, and the build fails if one is missing.</text></svg>