<meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@300;400;600;700&family=Source+Code+Pro:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#9c9696}svg{display:block;margin:0 0 40px}</style><section data-chart="f1_summary"><svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3022" viewBox="0 0 2400 3022"><rect x="0" y="0" width="2400" height="3022" fill="#eeece6"/><text x="60" y="90" font-family="Source Code Pro" font-size="15" font-weight="600" fill="#525252" letter-spacing="1">REPORT 2 · FRAME 1 OF 4</text><text x="60" y="166" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" letter-spacing="-1.6">PROJECT SUMMARY ANALYTICS</text><text x="60" y="212" font-family="Anek Latin" font-size="19" fill="#525252">The whole CoForge build, measured: 11 active days, 81 commits, 444 of your turns, and what it would have cost.</text><text x="60" y="242" font-family="Anek Latin" font-size="19" fill="#525252">Read this frame first. It is the shape of the project; the other three explain how it holds together.</text><line x1="60.0" y1="258.0" x2="2340.0" y2="258.0" stroke="#041222" stroke-width="2"/><g transform="translate(60,304)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">Four phases: build the system, give it a design language, move that language into Figma, then point it at real work</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Every figure below is counted from the git history and the session logs. Nothing is estimated.</text><text x="0" y="104" font-family="Anek Latin" font-size="15" fill="#525252">Each column is scaled against itself. Comparing across columns is meaningless — that is why they are five charts, not one.</text><text x="430" y="130" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252">Active time</text><text x="800" y="130" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252">Your turns</text><text x="1170" y="130" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252">Commits</text><text x="1540" y="130" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252">Words written by the agents</text><text x="1910" y="130" font-family="Anek Latin" font-size="14" font-weight="600" fill="#525252">Illustrative cost</text><line x1="0.0" y1="140.0" x2="2280.0" y2="140.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="170" font-family="Anek Latin" font-size="21" font-weight="700" fill="#041222" letter-spacing="-0.3">P1 · Agentic creation</text><text x="0" y="194" font-family="Source Code Pro" font-size="14" fill="#525252">2026-08-25 → 2026-08-27  ·  3 active days</text><text x="0" y="218" font-family="Anek Latin" font-size="13" fill="#525252">The system that builds: 14 agents, the routing</text><text x="0" y="236" font-family="Anek Latin" font-size="13" fill="#525252">table, Gate A/B, the artifact taxonomy, ADR-001</text><text x="0" y="254" font-family="Anek Latin" font-size="13" fill="#525252">to ADR-014.</text><rect x="430" y="158" width="150.3" height="20" fill="#041222"/><text x="430" y="204" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">5.1h</text><rect x="800" y="158" width="126.9" height="20" fill="#041222"/><text x="800" y="204" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">75</text><rect x="1170" y="158" width="45.5" height="20" fill="#041222"/><text x="1170" y="204" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">4</text><rect x="1540" y="158" width="174.4" height="20" fill="#041222"/><text x="1540" y="204" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">1.92M</text><rect x="1910" y="158" width="155" height="20" fill="#041222"/><text x="1910" y="204" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#04122 ly="Anek Latin" font-size="13" fill="#525252">as variables, the Carbon adapter lands 208</text><text x="0" y="518" font-family="Anek Latin" font-size="13" fill="#525252">components, CI runs the audit on a real PR.</text><rect x="430" y="422" width="112" height="20" fill="#041222"/><text x="430" y="468" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">3.8h</text><rect x="800" y="422" width="123.5" height="20" fill="#041222"/><text x="800" y="468" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">73</text><rect x="1170" y="422" width="216.2" height="20" fill="#041222"/><text x="1170" y="468" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">19</text><rect x="1540" y="422" width="101.8" height="20" fill="#041222"/><text x="1540" y="468" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">1.12M</text><rect x="1910" y="422" width="98.7" height="20" fill="#041222"/><text x="1910" y="468" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">$318</text><line x1="0.0" y1="536.0" x2="2280.0" y2="536.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="566" font-family="Anek Latin" font-size="21" font-weight="700" fill="#041222" letter-spacing="-0.3">P4 · First application</text><text x="0" y="590" font-family="Source Code Pro" font-size="14" fill="#525252">2026-09-03 → 2026-09-08  ·  4 active days</text><text x="0" y="614" font-family="Anek Latin" font-size="13" fill="#525252">The system is pointed at real work: Batch 3,</text><text x="0" y="632" font-family="Anek Latin" font-size="13" fill="#525252">capture round 1 across 17 competitors, the</text><text x="0" y="650" font-family="Anek Latin" font-size="13" fill="#525252">findings dashboard.</text><rect x="430" y="554" width="330" height="20" fill="#041222"/><text x="430" y="600" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">11.2h</text><rect x="800" y="554" width="330" height="20" fill="#041222"/><text x="800" y="600" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">195</text><rect x="1170" y="554" width="330" height="20" fill="#041222"/><text x="1170" y="600" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">29</text><rect x="1540" y="554" width="330" height="20" fill="#041222"/><text x="1540" y="600" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">3.63M</text><rect x="1910" y="554" width="330" height="20" fill="#041222"/><text x="1910" y="600" font-family="Source Code Pro" font-size="20" font-weight="600" fill="#041222">$1,064</text><line x1="0.0" y1="668.0" x2="2280.0" y2="668.0" stroke="#6f6f6f" stroke-width="1"/><text x="0" y="698" font-family="Anek Latin" font-size="14" fill="#525252">Each phase's hours are rounded on their own, so the four add up to 23.7h against an exact total of 23.6h. The total is the measured figure; the parts are the rounded ones.</text></g><g transform="translate(60,1076)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">66 percent of the cost is the agents re-reading their own conversation</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Illustrative only — nothing was billed at these rates. Opus 5 list price, one-hour cache. Total $2,278.</text><text x="454" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Re-reading the conversation each turn</text><rect x="470" y="135" width="1220" height="18" fill="#b03822"/><text x="1704" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">$1,502</text><text x="1824" y="148" font-family="Anek Latin" font-size="14" fill="#525252">3.00B tokens at $0.50 per million</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="454" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Writing to the cache</text><rect x="470" y="179" width="478.7" height="18" fill="#041222"/><text x="1704" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">$589</text><text x="1824" y="192" font-family="Anek Latin" font-size="14" fill="#525252">58.9M tokens at $10.00 per million</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="454" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">What the agents actually wrote</text><rect x="470" y="223" width="151.2" height="18" fill="#041222"/><text x="1704" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">$186</text><text x="1824" y="236" font-family="Anek Latin" font-size="14" fill="#525252">7.45M tokens at $25.00 per million</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="454" y="280" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Fresh input</text><rect x="470" y="267" width="0" height="18" fill="#041222"/><text x="1704" y="281" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">$0</text><text x="1824" y="280" font-family="Anek Latin" font-size="14" fill="#525252">11,772 tokens at $5.00 per million</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="338" font-family="Anek Latin" font-size="16" fill="#041222">A long agent session re-sends the whole conversation every single turn, so the same words are paid for again and again.</text><text x="0" y="362" font-family="Anek Latin" font-size="16" fill="#041222">That re-reading is 66% of the bill. The work the agents actually produced is 8%.</text></g><g transform="translate(60,1506)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">The work is lumpy, not steady — and the two measures agree</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Same days, same order, two separate scales. Reading one against the other is the point.</text><text x="0" y="96" font-family="Anek Latin" font-size="17" font-weight="600" fill="#041222">Words written by the agents, per day</text><rect x="0" y="172.9" width="198.2" height="99.1" fill="#041222"/><text x="99.1" y="292" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">0.86M</text><text x="99.1" y="312" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-25</text><rect x="208.2" y="237.5" width="198.2" height="34.5" fill="#041222"/><text x="307.3" y="292" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">0.30M</text><text x="307.3" y="312" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-26</text><rect x="416.4" y="185.6" width="198.2" height="86.4" fill="#041222"/><text x="515.5" y="292" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">0.75M</text><text x="515.5" y="312" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-27</text><rect x="624.5" y="217.6" width="198.2" height="54.4" fill="#041222"/><text x="723.6" y="292" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">0.47M</text><text x="723.6" y="312" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-28</text><rect x="832.7" y="236.3" width="198.2" height="35.7" fill="#041222"/><text x="931.8" y="292" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">0.31M</text><text x="931.8" y="312" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-31</text><rect x="1040.9" y="202.4" width="198.2" height="69.6" fill="#041222"/><text x="1140" y="292" font  landed, per day</text><rect x="0" y="548" width="198.2" height="0" fill="#041222"/><text x="99.1" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">0</text><text x="99.1" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-25</text><rect x="208.2" y="540.5" width="198.2" height="7.5" fill="#041222"/><text x="307.3" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">1</text><text x="307.3" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-26</text><rect x="416.4" y="525.6" width="198.2" height="22.4" fill="#041222"/><text x="515.5" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">3</text><text x="515.5" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-27</text><rect x="624.5" y="413.8" width="198.2" height="134.2" fill="#041222"/><text x="723.6" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">18</text><text x="723.6" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-28</text><rect x="832.7" y="466" width="198.2" height="82" fill="#041222"/><text x="931.8" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">11</text><text x="931.8" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">08-31</text><rect x="1040.9" y="503.3" width="198.2" height="44.7" fill="#041222"/><text x="1140" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">6</text><text x="1140" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">09-01</text><rect x="1249.1" y="451.1" width="198.2" height="96.9" fill="#041222"/><text x="1348.2" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">13</text><text x="1348.2" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">09-02</text><rect x="1457.3" y="525.6" width="198.2" height="22.4" fill="#041222"/><text x="1556.4" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">3</text><text x="1556.4" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">09-03</text><rect x="1665.5" y="533.1" width="198.2" height="14.9" fill="#041222"/><text x="1764.5" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">2</text><text x="1764.5" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">09-04</text><rect x="1873.6" y="384" width="198.2" height="164" fill="#041222"/><text x="1972.7" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">22</text><text x="1972.7" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">09-07</text><rect x="2081.8" y="533.1" width="198.2" height="14.9" fill="#041222"/><text x="2180.9" y="568" font-family="Source Code Pro" font-size="14" font-weight="600" fill="#041222" text-anchor="middle">2</text><text x="2180.9" y="588" font-family="Anek Latin" font-size="13" fill="#525252" text-anchor="middle">09-08</text><line x1="0.0" y1="548.0" x2="2280.0" y2="548.0" stroke="#6f6f6f" stroke-width="1"/><text x="0" y="626" font-family="Anek Latin" font-size="15" fill="#525252">Sep 7 is the single biggest day on both measures: the findings dashboard was built, attacked by two agents, and rebuilt.</text></g><g transform="translate(60,2202)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">“How long did this take?” has two honest answers, 4 times apart</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">This is why the number is defined on the board rather than just printed. An undefined metric cannot be compared to anything.</text><text x="454" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Minutes with something actually happening</text><rect x="470" y="135" width="292.1" height="18" fill="#b03822"/><text x="1624" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">23.6h</text><text x="1734" y="148" font-family="Anek Latin" font-size="14" fill="#525252">counts a minute once, however busy it was</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="454" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">First to last activity each day</text><rect x="470" y="179" width="1140" height="18" fill="#041222"/><text x="1624" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">92.1h</text><text x="1734" y="192" font-family="Anek Latin" font-size="14" fill="#525252">includes every gap inside a working day</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="252" font-family="Anek Latin" font-size="16" fill="#041222">Both are honest; they answer different questions. The board uses the first, because it is the one that cannot flatter.</text></g><line x1="60.0" y1="2524.0" x2="2340.0" y2="2524.0" stroke="#041222" stroke-width="2"/><text x="60" y="2590" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What this means</text><rect x="60" y="2613" width="22" height="22" fill="#041222"/><text x="67" y="2630" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="98" y="2631" font-family="Anek Latin" font-size="17" fill="#041222">The heaviest phase was not building the system — it was using</text><text x="98" y="2655" font-family="Anek Latin" font-size="17" fill="#041222">it. First application took 11.2 of the 23.6 active hours.</text><rect x="60" y="2679" width="22" height="22" fill="#041222"/><text x="67" y="2696" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="98" y="2697" font-family="Anek Latin" font-size="17" fill="#041222">Cost is dominated by re-reading, not by writing. 66% of the</text><text x="98" y="2721" font-family="Anek Latin" font-size="17" fill="#041222">bill is the agents re-sending the conversation.</text><rect x="60" y="2745" width="22" height="22" fill="#041222"/><text x="67" y="2762" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="98" y="2763" font-family="Anek Latin" font-size="17" fill="#041222">The work is bursty. The busiest single day, Sep 7, produced</text><text x="98" y="2787" font-family="Anek Latin" font-size="17" fill="#041222">19% of everything the agents wrote in fourteen days.</text><rect x="60" y="2811" width="22" height="22" fill="#041222"/><text x="67" y="2828" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="98" y="2829" font-family="Anek Latin" font-size="17" fill="#041222">'How long did it take' has two honest answers four times</text><text x="98" y="2853" font-family="Anek Latin" font-size="17" fill="#041222">apart, so the board defines which one it uses.</text><text x="1230" y="2590" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What to do next</text><rect x="1230" y="2613" width="22" height="22" fill="#b03822"/><text x="1237" y="2630" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="1268" y="2631" font-family="Anek Latin" font-size="17" fill="#041222">Shorten sessions, or compact them. The re-reading cost grows</text><text x="1268" y="2655" font-family="Anek Latin" font-size="17" fill="#041222">with the square of the conversation length.</text><rect x="1230" y="2679" width="22" height="22" fill="#b03822"/><text x="1237" y="2696" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="1268" y="2697" font-family="Anek Latin" font-size="17" fill="#041222">Keep the two time definitions in the metrics schema so future</text><text x="1268" y="2721" font-family="Anek Latin" font-size="17" fill="#041222">reports stay comparable.</text><rect x="1230" y="2745" width="22" height="22" fill="#b03822"/><text x="1237" y="2762" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="1268" y="2763" font-family="Anek Latin" font-size="17" fill="#041222">Point the same instrument at the next deliverable before it</text><text x="1268" y="2787" font-family="Anek Latin" font-size="17" fill="#041222">starts, not after.</text><rect x="1230" y="2811" width="22" height="22" fill="#b03822"/><text x="1237" y="2828" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="1268" y="2829" font-family="Anek Latin" font-size="17" fill="#041222">Get real billing figures to replace the illustrative dollars;</text><text x="1268" y="2853" font-family="Anek Latin" font-size="17" fill="#041222">the token counts are already exact.</text><line x1="60.0" y1="2920.0" x2="2340.0" y2="2920.0" stroke="#e0e0e0" stroke-width="1"/><text x="60" y="2968" font-family="Anek Latin" font-size="14" fill="#525252">CoForge · measured from the git history and the session logs, frozen at 2026-09-08 12:11 UTC (the last record in the corpus, not the time the script ran) · every transcript record counted once, keyed on message uuid · dollars are illustrative at Opus 5 list price and were never billed</text><text x="60" y="2990" font-family="Anek Latin" font-size="14" fill="#525252">The repository counts do not include this report: it was committed after the figures were frozen, so the artifact and commit totals here are one behind by construction.</text></svg></section><section data-chart="f2_blueprint"><svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2880" viewBox="0 0 2400 2880"><rect x="0" y="0" width="2400" height="2880" fill="#eeece6"/><text x="60" y="90" font-family="Source Code Pro" font-size="15" font-weight="600" fill="#525252" letter-spacing="1">REPORT 2 · FRAME 2 OF 4</text><text x="60" y="166" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" letter-spacing="-1.6">AGENTIC BLUEPRINT</text><text x="60" y="212" font-family="Anek Latin" font-size="19" fill="#525252">How the system is put together: who does the work, what stops a mistake, and where the real work goes.</text><text x="60" y="242" font-family="Anek Latin" font-size="19" fill="#525252">Benchmarked against the Claude Code standard — agents with narrow tools, checks that run automatically, decisions written down.</text><line x1="60.0" y1="258.0" x2="2340.0" y2="258.0" stroke="#041222" stroke-width="2"/><g transform="translate(60,304)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">11 of the fourteen agents have done real work; 3 are waiting for a phase that has not happened</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">How many times each agent was handed a task, counted from the session logs. 55 dispatches to these fourteen; 10 more went to general-purpose helpers that sit outside the roster.</text><text x="414" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">system-keeper</text><rect x="430" y="135" width="1760" height="18" fill="#041222"/><text x="2204" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">16</text><line x1="0.0" y1="167.0" x2="2280.0" y2="167.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="188" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">dashboard-analyst</text><rect x="430" y="175" width="990" height="18" fill="#041222"/><text x="2204" y="189" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">9</text><line x1="0.0" y1="207.0" x2="2280.0" y2="207.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="228" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">token-keeper</text><rect x="430" y="215" width="990" height="18" fill="#041222"/><text x="2204" y="229" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">9</text><line x1="0.0" y1="247.0" x2="2280.0" y2="247.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="268" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">a11y-checker</text><rect x="430" y="255" width="550" height="18" fill="#041222"/><text x="2204" y="269" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">5</text><line x1="0.0" y1="287.0" x2="2280.0" y2="287.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="308" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">research-synthesizer</text><rect x="430" y="295" width="440" height="18" fill="#041222"/><text x="2204" y="309" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">4</text><line x1="0.0" y1="327.0" x2="2280.0" y2="327.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="348" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">orchestrator</text><rect x="430" y="335" width="440" height="18" fill="#041222"/><text x="2204" y="349" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">4</text><line x1="0.0" y1="367.0" x2="2280.0" y2="367.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="388" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">design-critic</text><rect x="430" y="375" width="330" height="18" fill="#041222"/><text x="2204" y="389" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">3</text><line x1="0.0" y1="407.0" x2="2280.0" y2="407.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="428" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">research-ops</text><rect x="430" y="415" width="220" height="18" fill="#041222"/><text x="2204" y="429" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">2</text><line x1="0.0" y1="447.0" x2="2280.0" y2="447.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="468" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">screen-producer</text><rect x="430" y="455" width="110" height="18" fill="#041222"/><text x="2204" y="469" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><line x1="0.0" y1="487.0" x2="2280.0" y2="487.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="508" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">content-comms</text><rect x="430" y="495" width="110" height="18" fill="#041222"/><text x="2204" y="509" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><line x1="0.0" y1="527.0" x2="2280.0" y2="527.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="548" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">brand-director</text><rect x="430" y="535" width="110" height="18" fill="#041222"/><text x="2204" y="549" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><line x1="0.0" y1="567.0" x2="2280.0" y2="567.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="588" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">diagram-cartographer</text><rect x="430" y="575" width="0" height="18" fill="#041222"/><text x="2204" y="589" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">0</text><line x1="0.0" y1="607.0" x2="2280.0" y2="607.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="628" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">evidence-clerk</text><rect x="430" y="615" width="0" height="18" fill="#041222"/><text x="2204" y="629" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">0</text><line x1="0.0" y1="647.0" x2="2280.0" y2="647.0" stroke="#e0e0e0" stroke-width="1"/><text x="414" y="668" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">handoff-scribe</text><rect x="430" y="655" width="0" height="18" fill="#041222"/><text x="2204" y="669" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">0</text><line x1="0.0" y1="687.0" x2="2280.0" y2="687.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="724" font-family="Anek Latin" font-size="16" font-weight="600" fill="#041222">3 of 14 have never been dispatched: diagram-cartographer, evidence-clerk, handoff-scribe.</text><text x="0" y="748" font-family="Anek Latin" font-size="16" fill="#525252">That is not idleness. Each belongs to a phase of the design process this project has not reached yet — there is no user research to log, and nothing has shipped to hand over.</text></g><g transform="translate(60,1122)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">Six ways to stop a mistake, ranked by how hard they are to ignore</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">The rule of the system: never solve with a written rule what a permission can solve.</text><text x="0" y="104" font-family="Anek Latin" font-size="15" fill="#525252">Strongest at the top. Prose is the weakest layer, which is why only two rules live there.</text><line x1="0.0" y1="118.0" x2="2280.0" y2="118.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="144" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222">1 · Impossible</text><text x="300" y="144" font-family="Anek Latin" font-size="16" fill="#041222">The agent is never given the tool</text><text x="1120" y="144" font-family="Source Code Pro" font-size="15" fill="#525252">.claude/settings.json</text><text x="2280" y="144" font-family="Anek Latin" font-size="15" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="172.0" x2="2280.0" y2="172.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="198" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222">2 · Blocked</text><text x="300" y="198" font-family="Anek Latin" font-size="16" fill="#041222">The save is refused before it happens</text><text x="1120" y="198" font-family="Source Code Pro" font-size="15" fill="#525252">.claude/hooks/gate-b.py</text><text x="2280" y="198" font-family="Anek Latin" font-size="15" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="226.0" x2="2280.0" y2="226.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="252" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222">2b · Backstop</text><text x="300" y="252" font-family="Anek Latin" font-size="16" fill="#041222">Catches writes that dodge layer 2</text><text x="1120" y="252" font-family="Source Code Pro" font-size="15" fill="#525252">.claude/hooks/session-check.py</text><text x="2280" y="252" font-family="Anek Latin" font-size="15" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="280.0" x2="2280.0" y2="280.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="306" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222">3 · Failed</text><text x="300" y="306" font-family="Anek Latin" font-size="16" fill="#041222">The build goes red after the fact</text><text x="1120" y="306" font-family="Source Code Pro" font-size="15" fill="#525252">.github/workflows/ci.yml</text><text x="2280" y="306" font-family="Anek Latin" font-size="15" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="334.0" x2="2280.0" y2="334.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="360" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222">4 · Visible</text><text x="300" y="360" font-family="Anek Latin" font-size="16" fill="#041222">Someone can see it went wrong</text><text x="1120" y="360" font-family="Source Code Pro" font-size="15" fill="#525252">validation/reports/</text><text x="2280" y="360" font-family="Anek Latin" font-size="15" fill="#041222" text-anchor="end">enforced by a machine</text><line x1="0.0" y1="388.0" x2="2280.0" y2="388.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="414" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222">5 · Written</text><text x="300" y="414" font-family="Anek Latin" font-size="16" fill="#041222">A rule in prose, and nothing more</text><text x="1120" y="414" font-family="Source Code Pro" font-size="15" fill="#525252">CLAUDE.md — two prohibitions</text><text x="2280" y="414" font-family="Anek Latin" font-size="15" fill="#b03822" text-anchor="end">enforced by nobody</text><line x1="0.0" y1="442.0" x2="2280.0" y2="442.0" stroke="#6f6f6f" stroke-width="1"/><text x="0" y="476" font-family="Anek Latin" font-size="16" fill="#041222">Every layer names a real file. A layer that named nothing would read as coverage while protecting nothing — which is the exact failure this list was built to prevent.</text></g><g transform="translate(60,1668)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">What the agents actually spent their time doing</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">The twelve most-used tools, counted from the session logs.</text><text x="414" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Bash</text><rect x="430" y="135" width="1740" height="18" fill="#041222"/><text x="2184" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1,475</text><line x1="0.0" y1="167.0" x2="22 " fill="#041222"/><text x="2184" y="589" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">34</text><line x1="0.0" y1="607.0" x2="2280.0" y2="607.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="644" font-family="Anek Latin" font-size="16" fill="#041222">2,574 tool calls in total across 5,904 agent turns.</text></g><line x1="60.0" y1="2382.0" x2="2340.0" y2="2382.0" stroke="#041222" stroke-width="2"/><text x="60" y="2448" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What this means</text><rect x="60" y="2471" width="22" height="22" fill="#041222"/><text x="67" y="2488" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="98" y="2489" font-family="Anek Latin" font-size="17" fill="#041222">11 of fourteen agents have done real work. The 3 idle ones</text><text x="98" y="2513" font-family="Anek Latin" font-size="17" fill="#041222">map to phases this project has not reached.</text><rect x="60" y="2537" width="22" height="22" fill="#041222"/><text x="67" y="2554" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="98" y="2555" font-family="Anek Latin" font-size="17" fill="#041222">Every enforcement layer names a real file. The weakest layer,</text><text x="98" y="2579" font-family="Anek Latin" font-size="17" fill="#041222">prose, carries only two rules on purpose.</text><rect x="60" y="2603" width="22" height="22" fill="#041222"/><text x="67" y="2620" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="98" y="2621" font-family="Anek Latin" font-size="17" fill="#041222">The busiest tools are reading and running things — the agents</text><text x="98" y="2645" font-family="Anek Latin" font-size="17" fill="#041222">spend most of their effort checking, not writing.</text><rect x="60" y="2669" width="22" height="22" fill="#041222"/><text x="67" y="2686" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="98" y="2687" font-family="Anek Latin" font-size="17" fill="#041222">No agent holds a Figma tool. This board was written by the</text><text x="98" y="2711" font-family="Anek Latin" font-size="17" fill="#041222">main session, because the grant was never made.</text><text x="1230" y="2448" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What to do next</text><rect x="1230" y="2471" width="22" height="22" fill="#b03822"/><text x="1237" y="2488" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="1268" y="2489" font-family="Anek Latin" font-size="17" fill="#041222">Make the ADR-007 Figma grant now that a real file exists, and</text><text x="1268" y="2513" font-family="Anek Latin" font-size="17" fill="#041222">test it rather than assume it.</text><rect x="1230" y="2537" width="22" height="22" fill="#b03822"/><text x="1237" y="2554" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="1268" y="2555" font-family="Anek Latin" font-size="17" fill="#041222">Give the 3 unused agents their first real task, or retire</text><text x="1268" y="2579" font-family="Anek Latin" font-size="17" fill="#041222">them from the roster.</text><rect x="1230" y="2603" width="22" height="22" fill="#b03822"/><text x="1237" y="2620" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="1268" y="2621" font-family="Anek Latin" font-size="17" fill="#041222">Keep the routing table as the single place that decides who</text><text x="1268" y="2645" font-family="Anek Latin" font-size="17" fill="#041222">does what — it already routed 55 dispatches to the roster.</text><rect x="1230" y="2669" width="22" height="22" fill="#b03822"/><text x="1237" y="2686" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="1268" y="2687" font-family="Anek Latin" font-size="17" fill="#041222">Add a counter for the autonomy ladder, which is still</text><text x="1268" y="2711" font-family="Anek Latin" font-size="17" fill="#041222">declared but not operative.</text><line x1="60.0" y1="2778.0" x2="2340.0" y2="2778.0" stroke="#e0e0e0" stroke-width="1"/><text x="60" y="2826" font-family="Anek Latin" font-size="14" fill="#525252">CoForge · measured from the git history and the session logs, frozen at 2026-09-08 12:11 UTC (the last record in the corpus, not the time the script ran) · every transcript record counted once, keyed on message uuid · dollars are illustrative at Opus 5 list price and were never billed</text><text x="60" y="2848" font-family="Anek Latin" font-size="14" fill="#525252">The repository counts do not include this report: it was committed after the figures were frozen, so the artifact and commit totals here are one behind by construction.</text></svg></section><section data-chart="f3_competitor"><svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2290" viewBox="0 0 2400 2290"><rect x="0" y="0" width="2400" height="2290" fill="#eeece6"/><text x="60" y="90" font-family="Source Code Pro" font-size="15" font-weight="600" fill="#525252" letter-spacing="1">REPORT 2 · FRAME 3 OF 4</text><text x="60" y="166" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" letter-spacing="-1.6">COMPETITOR ANALYSIS</text><text x="60" y="212" font-family="Anek Latin" font-size="19" fill="#525252">Deliverable #1, start to finish: 17 competitors, 50 capture files, 121 findings, and what went wrong on the way.</text><text x="60" y="242" font-family="Anek Latin" font-size="19" fill="#525252">This is the first time the whole system was pointed at a real piece of work.</text><line x1="60.0" y1="258.0" x2="2340.0" y2="258.0" stroke="#041222" stroke-width="2"/><g transform="translate(60,304)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">How Deliverable #1 was actually run, start to finish</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Seven steps. The last two are the ones most processes leave out.</text><rect x="0" y="128" width="46" height="46" fill="#041222"/><text x="23" y="158" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">1</text><text x="70" y="148" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Plan</text><text x="70" y="170" font-family="Anek Latin" font-size="16" fill="#525252">research-plan written and approved</text><text x="2280" y="158" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">ART-024</text><line x1="23.0" y1="174.0" x2="23.0" y2="202.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="202" width="46" height="46" fill="#041222"/><text x="23" y="232" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">2</text><text x="70" y="222" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Capture</text><text x="70" y="244" font-family="Anek Latin" font-size="16" fill="#525252">17 competitors visited in two browsers, 50 files written</text><text x="2280" y="232" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">ART-025</text><line x1="23.0" y1="248.0" x2="23.0" y2="276.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="276" width="46" height="46" fill="#041222"/><text x="23" y="306" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">3</text><text x="70" y="296" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Index</text><text x="70" y="318" font-family="Anek Latin" font-size="16" fill="#525252">121 findings extracted, each tied to a named file</text><text x="2280" y="306" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">CAPTURE-INDEX</text><line x1="23.0" y1="322.0" x2="23.0" y2="350.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="350" width="46" height="46" fill="#041222"/><text x="23" y="380" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">4</text><text x="70" y="370" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Synthesise</text><text x="70" y="392" font-family="Anek Latin" font-size="16" fill="#525252">findings grouped into insights and recommendations</text><text x="2280" y="380" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">ART-026</text><line x1="23.0" y1="396.0" x2="23.0" y2="424.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="424" width="46" height="46" fill="#041222"/><text x="23" y="454" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">5</text><text x="70" y="444" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Chart</text><text x="70" y="466" font-family="Anek Latin" font-size="16" fill="#525252">11 charts built, then checked on the rendered page</text><text x="2280" y="454" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">verify-charts</text><line x1="23.0" y1="470.0" x2="23.0" y2="498.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="498" width="46" height="46" fill="#041222"/><text x="23" y="528" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">6</text><text x="70" y="518" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Attack</text><text x="70" y="540" font-family="Anek Latin" font-size="16" fill="#525252">two agents tried to break the result; both found real defects</text><text x="2280" y="528" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">2 reports</text><line x1="23.0" y1="544.0" x2="23.0" y2="572.0" stroke="#6f6f6f" stroke-width="2"/><rect x="0" y="572" width="46" height="46" fill="#041222"/><text x="23" y="602" font-family="Source Code Pro" font-size="20" font-weight="700" fill="#eeece6" text-anchor="middle">7</text><text x="70" y="592" font-family="Anek Latin" font-size="20" font-weight="700" fill="#041222">Fix</text><text x="70" y="614" font-family="Anek Latin" font-size="16" fill="#525252">every defect fixed, then re-planted to prove the fix works</text><text x="2280" y="602" font-family="Source Code Pro" font-size="14" fill="#525252" text-anchor="end">C-053–C-056</text></g><g transform="translate(60,1016)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">121 findings, and every one carries the confidence its capture file gave it</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Deliverable #1 — hands-on competitor capture, 17 competitors, 50 capture files.</text><text x="544" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Verified — exact quote from a capture file</text><rect x="560" y="135" width="1220" height="18" fill="#041222"/><text x="1794" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">101</text><text x="1894" y="148" font-family="Anek Latin" font-size="14" fill="#525252">83% of all findings</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Verified — but qualified in the source</text><rect x="560" y="179" width="157" height="18" fill="#041222"/><text x="1794" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">13</text><text x="1894" y="192" font-family="Anek Latin" font-size="14" fill="#525252">11%</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">A pointer to another file, not a claim</text><rect x="560" y="223" width="84.6" height="18" fill="#041222"/><text x="1794" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">7</text><text x="1894" y="236" font-family="Anek Latin" font-size="14" fill="#525252">6%</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="296" font-family="Anek Latin" font-size="16" fill="#041222">Confidence is copied from the capture file exactly as written. Nothing is promoted, merged, or upgraded by the board.</text></g><g transform="translate(60,1382)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">What this round taught us — all of it found by attacking our own work</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Six defects across five corrections — C-046, and C-053 to C-056 — each with its fix and a test that proves the fix bites.</text><text x="504" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">A bar chart whose bars were invisible</text><rect x="520" y="135" width="330" height="18" fill="#b03822"/><text x="1524" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><text x="1594" y="148" font-family="Anek Latin" font-size="14" fill="#525252">1.45:1 contrast — passed every check for weeks</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Checks that could never fail</text><rect x="520" y="179" width="990" height="18" fill="#041222"/><text x="1524" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">3</text><text x="1594" y="192" font-family="Anek Latin" font-size="14" fill="#525252">exempt by class name, wrong scope, never clicked</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Colour tests silently switched off</text><rect x="520" y="223" width="330" height="18" fill="#041222"/><text x="1524" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><text x="1594" y="236" font-family="Anek Latin" font-size="14" fill="#525252">backslashes eaten twice; reported clean while testing nothing</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="280" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Wrong company credited for a finding</text><rect x="520" y="267" width="330" height="18" fill="#041222"/><text x="1524" y="281" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">1</text><text x="1594" y="280" font-family="Anek Latin" font-size="14" fill="#525252">found by an agent that was looking for something else</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="340" font-family="Anek Latin" font-size="16" fill="#041222">None of these were found by whoever wrote them. Every one was found by an agent sent in specifically to attack the work.</text></g><line x1="60.0" y1="1792.0" x2="2340.0" y2="1792.0" stroke="#041222" stroke-width="2"/><text x="60" y="1858" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What this means</text><rect x="60" y="1881" width="22" height="22" fill="#041222"/><text x="67" y="1898" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="98" y="1899" font-family="Anek Latin" font-size="17" fill="#041222">Every one of the 121 findings resolves to a named capture</text><text x="98" y="1923" font-family="Anek Latin" font-size="17" fill="#041222">file. Nothing on the board is unsourced.</text><rect x="60" y="1947" width="22" height="22" fill="#041222"/><text x="67" y="1964" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="98" y="1965" font-family="Anek Latin" font-size="17" fill="#041222">Confidence is transcribed, never interpreted. The board</text><text x="98" y="1989" font-family="Anek Latin" font-size="17" fill="#041222">cannot promote a weak finding into a strong one.</text><rect x="60" y="2013" width="22" height="22" fill="#041222"/><text x="67" y="2030" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="98" y="2031" font-family="Anek Latin" font-size="17" fill="#041222">The defects that mattered were invisible to every automatic</text><text x="98" y="2055" font-family="Anek Latin" font-size="17" fill="#041222">check and were found by attacking the work.</text><rect x="60" y="2079" width="22" height="22" fill="#041222"/><text x="67" y="2096" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="98" y="2097" font-family="Anek Latin" font-size="17" fill="#041222">A bar chart shipped for weeks with bars at 1.45:1 — visually</text><text x="98" y="2121" font-family="Anek Latin" font-size="17" fill="#041222">invisible — while passing every check.</text><text x="1230" y="1858" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What to do next</text><rect x="1230" y="1881" width="22" height="22" fill="#b03822"/><text x="1237" y="1898" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="1268" y="1899" font-family="Anek Latin" font-size="17" fill="#041222">Run round 2 on the 41 highest-value gaps that round 1 left</text><text x="1268" y="1923" font-family="Anek Latin" font-size="17" fill="#041222">blank.</text><rect x="1230" y="1947" width="22" height="22" fill="#b03822"/><text x="1237" y="1964" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">2</text><text x="1268" y="1965" font-family="Anek Latin" font-size="17" fill="#041222">Bring the two verifiers under the machinery hash; today they</text><text x="1268" y="1989" font-family="Anek Latin" font-size="17" fill="#041222">check the work but nothing checks them.</text><rect x="1230" y="2013" width="22" height="22" fill="#b03822"/><text x="1237" y="2030" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">3</text><text x="1268" y="2031" font-family="Anek Latin" font-size="17" fill="#041222">Keep the attack step. It found six real defects that six</text><text x="1268" y="2055" font-family="Anek Latin" font-size="17" fill="#041222">weeks of green checks did not.</text><rect x="1230" y="2079" width="22" height="22" fill="#b03822"/><text x="1237" y="2096" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">4</text><text x="1268" y="2097" font-family="Anek Latin" font-size="17" fill="#041222">Decide whether the evidence ledger gets populated, or stop</text><text x="1268" y="2121" font-family="Anek Latin" font-size="17" fill="#041222">claiming the Design Loop is runnable.</text><line x1="60.0" y1="2188.0" x2="2340.0" y2="2188.0" stroke="#e0e0e0" stroke-width="1"/><text x="60" y="2236" font-family="Anek Latin" font-size="14" fill="#525252">CoForge · measured from the git history and the session logs, frozen at 2026-09-08 12:11 UTC (the last record in the corpus, not the time the script ran) · every transcript record counted once, keyed on message uuid · dollars are illustrative at Opus 5 list price and were never billed</text><text x="60" y="2258" font-family="Anek Latin" font-size="14" fill="#525252">The repository counts do not include this report: it was committed after the figures were frozen, so the artifact and commit totals here are one behind by construction.</text></svg></section><section data-chart="f4_contract"><svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2510" viewBox="0 0 2400 2510"><rect x="0" y="0" width="2400" height="2510" fill="#eeece6"/><text x="60" y="90" font-family="Source Code Pro" font-size="15" font-weight="600" fill="#525252" letter-spacing="1">REPORT 2 · FRAME 4 OF 4</text><text x="60" y="166" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" letter-spacing="-1.6">AGENTIC CONTRACT</text><text x="60" y="232" font-family="Anek Latin" font-size="56" font-weight="700" fill="#041222" letter-spacing="-1.6">&amp; ADOPTION</text><text x="60" y="278" font-family="Anek Latin" font-size="19" fill="#525252">The promises the system makes, and how much of it is actually being used.</text><text x="60" y="308" font-family="Anek Latin" font-size="19" fill="#525252">The contract is short on purpose: two prohibitions, two sources of truth, and one way in.</text><line x1="60.0" y1="324.0" x2="2340.0" y2="324.0" stroke="#041222" stroke-width="2"/><g transform="translate(60,370)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">Who actually catches the mistakes</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">All 57 logged mistakes, sorted by who found them. Coral marks the source you cannot rely on.</text><text x="624" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">An agent sent in to check someone else's work</text><rect x="640" y="135" width="1550" height="18" fill="#041222"/><text x="2204" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">26</text><line x1="0.0" y1="179.0" x2="2280.0" y2="179.0" stroke="#e0e0e0" stroke-width="1"/><text x="624" y="200" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">An automatic check, firing on its own</text><rect x="640" y="187" width="298.1" height="18" fill="#041222"/><text x="2204" y="201" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">5</text><line x1="0.0" y1="231.0" x2="2280.0" y2="231.0" stroke="#e0e0e0" stroke-width="1"/><text x="624" y="252" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">You, by asking a question</text><rect x="640" y="239" width="357.7" height="18" fill="#041222"/><text x="2204" y="253" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">6</text><line x1="0.0" y1="283.0" x2="2280.0" y2="283.0" stroke="#e0e0e0" stroke-width="1"/><text x="624" y="304" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Whoever made the mistake, catching it themselves</text><rect x="640" y="291" width="1192.3" height="18" fill="#b03822"/><text x="2204" y="305" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">20</text><line x1="0.0" y1="335.0" x2="2280.0" y2="335.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="376" font-family="Anek Latin" font-size="19" font-weight="700" fill="#041222">37 of 57 mistakes — 65% — were found by someone other than whoever made them.</text><text x="0" y="402" font-family="Anek Latin" font-size="16" fill="#525252">This is the single most useful thing this project knows about itself. People and agents are bad at auditing their own work, and good at auditing each other's. The whole system is built around that one fact.</text></g><g transform="translate(60,844)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">219 components exist. We designed eleven of them.</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Counted from design-system/component-index.json.</text><text x="544" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Bought in — a vendor library we ingested</text><rect x="560" y="135" width="1160" height="18" fill="#041222"/><text x="1734" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">208</text><text x="1834" y="148" font-family="Anek Latin" font-size="14" fill="#525252">@carbon/react</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Built here, and approved through the process</text><rect x="560" y="179" width="61.3" height="18" fill="#b03822"/><text x="1734" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">11</text><text x="1834" y="192" font-family="Anek Latin" font-size="14" fill="#525252">CoForge L1 primitives</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="254" font-family="Anek Latin" font-size="16" fill="#041222">This is why the design system is still declared RED. 208 components arrived in one import; they are a catalogue, not a system anyone here designed.</text><text x="0" y="278" font-family="Anek Latin" font-size="16" fill="#525252">A component only counts once a person has approved it and a written decision records why. Eleven have made it through.</text></g><g transform="translate(60,1192)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">33 deliverables produced; 2 have a human signature on them</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">Every deliverable carries a status. Nothing is 'done' until a person says so — that is Gate A.</text><text x="544" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Draft — made, not yet reviewed</text><rect x="560" y="135" width="1630" height="18" fill="#041222"/><text x="2204" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">20</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Superseded — replaced by a newer version</text><rect x="560" y="179" width="652" height="18" fill="#041222"/><text x="2204" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">8</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">In review — with a person now</text><rect x="560" y="223" width="244.5" height="18" fill="#041222"/><text x="2204" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">3</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="544" y="280" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Approved — signed off by a human</text><rect x="560" y="267" width="163" height="18" fill="#b03822"/><text x="2204" y="281" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">2</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="340" font-family="Anek Latin" font-size="16" fill="#041222">2 of 33 deliverables have been approved by a person. The rest are waiting, or were replaced.</text></g><g transform="translate(60,1602)"><text x="0" y="34" font-family="Anek Latin" font-size="28" font-weight="700" fill="#041222" letter-spacing="-0.5">The system learns by writing its mistakes down</text><text x="0" y="64" font-family="Anek Latin" font-size="16" fill="#525252">57 mistakes have produced 11 standing rules. The newest, SR-11: “A check that cannot fail is not a check.”</text><text x="504" y="148" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Mistakes logged, each with a fix</text><rect x="520" y="135" width="1670" height="18" fill="#041222"/><text x="2204" y="149" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">57</text><line x1="0.0" y1="171.0" x2="2280.0" y2="171.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="192" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Rules distilled from them</text><rect x="520" y="179" width="322.3" height="18" fill="#041222"/><text x="2204" y="193" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">11</text><line x1="0.0" y1="215.0" x2="2280.0" y2="215.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="236" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Written decisions (ADRs)</text><rect x="520" y="223" width="644.6" height="18" fill="#041222"/><text x="2204" y="237" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">22</text><line x1="0.0" y1="259.0" x2="2280.0" y2="259.0" stroke="#e0e0e0" stroke-width="1"/><text x="504" y="280" font-family="Anek Latin" font-size="16" fill="#041222" text-anchor="end">Audit reports written</text><rect x="520" y="267" width="937.5" height="18" fill="#041222"/><text x="2204" y="281" font-family="Source Code Pro" font-size="17" font-weight="600" fill="#041222">32</text><line x1="0.0" y1="303.0" x2="2280.0" y2="303.0" stroke="#e0e0e0" stroke-width="1"/><text x="0" y="340" font-family="Anek Latin" font-size="16" fill="#041222">A mistake that happens twice becomes a rule. The rules are injected into all 14 agent briefings automatically, and the build fails if one is missing.</text></g><line x1="60.0" y1="2012.0" x2="2340.0" y2="2012.0" stroke="#041222" stroke-width="2"/><text x="60" y="2078" font-family="Anek Latin" font-size="26" font-weight="700" fill="#041222" letter-spacing="-0.6">What this means</text><rect x="60" y="2101" width="22" height="22" fill="#041222"/><text x="67" y="2118" font-family="Source Code Pro" font-size="13" font-weight="700" fill="#eeece6">1</text><text x="98" y="2119" font-family="Anek Latin" font-size="17" fill="#041222">65% of mistakes were found by someone other than whoever made</text><text x="98" y="2143" font-family="Anek
